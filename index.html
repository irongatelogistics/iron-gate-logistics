      "@type": "PostalAddress",
      "streetAddress": "80614 Sears Rd",
      "addressLocality": "Cottage Grove",
      "addressRegion": "OR",

    },
    "telephone": "+19712450654",
    "email": "freightstorage@irongatelogi.com",
    "url": "https://irongatelogi.com",

      { "@type": "City", "name": "Cottage Grove, OR" },

  <!-- FAQPage structured data — mirrors the on-page FAQ section exactly -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is Iron Gate close to Eugene?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — we're just off I-5 Exit 174 or 182 in Cottage Grove, a short drive south of Eugene and Springfield. Easy on, easy off, no city traffic to fight."
        }
      },
      {
        "@type": "Question",
        "name": "Do you have truck parking near Creswell?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Iron Gate is the closest secure, fenced, 24/7-monitored truck and trailer lot serving the Creswell area — minutes off I-5."
        }
      },
      {
        "@type": "Question",
        "name": "Can I park a single truck, or only fleets?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Both. We work with owner-operators parking one rig and fleets needing multiple reserved spaces — monthly, weekly, and custom fleet pricing all available."
        }
      },
      {
        "@type": "Question",
        "name": "Is the lot secure?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Fully fenced, lit at night, and monitored 24/7. Built specifically for semis — wide lanes, no tight turns."
        }
      },
      {
        "@type": "Question",
        "name": "How do I reserve a spot?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Email freightstorage@irongatelogi.com or call (971) 245-0654 with your rig info and start date — we'll confirm availability within one business day."
        }
      }
    ]

<body>
  <!-- Iron Gate Logistics — Grand Opening announcement banner -->
  <div id="announcement-banner" style="background:#1a2332; color:#ffffff; font-family:Arial, Helvetica, sans-serif; padding:12px 20px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 18px; text-align:center; font-size:15px; line-height:1.4; position:relative;">
    <span style="font-weight:600;">
      🚛 <span style="color:#f5a623; font-weight:700;">NOW OPEN</span> — Grand Opening: Fleets park 5, get the <span style="color:#f5a623; font-weight:700;">6th stall FREE</span>. Refer a driver &amp; you both get a free week.
    </span>
    <a href="tel:19712450654" style="background:#f5a623; color:#1a2332; font-weight:700; text-decoration:none; padding:8px 16px; border-radius:4px; white-space:nowrap;">
      Call (971) 245-0654
    </a>
    <button onclick="dismissBanner()" aria-label="Dismiss" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#ffffff; font-size:20px; line-height:1; cursor:pointer; padding:0 4px;">&times;</button>
  </div>

  <script>
    // Track banner height as a CSS variable so the fixed nav can sit below it.
    function updateBannerH() {
      var b = document.getElementById('announcement-banner');
      var h = (b && b.style.display !== 'none') ? b.offsetHeight : 0;
      document.documentElement.style.setProperty('--banner-h', h + 'px');
    }
    function dismissBanner() {
      var b = document.getElementById('announcement-banner');
      if (b) b.style.display = 'none';
      document.documentElement.style.setProperty('--banner-h', '0px');
    }
    updateBannerH();
    window.addEventListener('resize', updateBannerH);
  </script>

  <div id="root"></div>
